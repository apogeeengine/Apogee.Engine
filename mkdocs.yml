site_name: Apogee Engine
site_description: A free, open-source C# 3D engine made for crunching numbers.
site_url: https://apogeeengine.github.io/docs/
repo_url: https://github.com/apogeeengine/Apogee.Engine
repo_name: apogeeengine/Apogee.Engine
edit_uri: edit/main/Docs/
docs_dir: Docs
site_dir: Bin/site
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

# The API reference (Docs/api/csharp, Docs/api/luau) is generated by ./build.sh docs: its pages are not in the navigation, only reachable from their index pages and the search.
not_in_nav: |
  /api/csharp/Apogee.*.md
  /api/luau/classes/
  /api/luau/libraries/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - About:
      - Introduction: about/introduction.md
      - FAQ: about/faq.md
      - License: about/license.md
  - Getting started:
      - Building: getting-started/building.md
      - Samples:
          - Viewer: getting-started/samples/viewer.md
          - Scripting: getting-started/samples/scripting.md
          - Mods: getting-started/samples/mods.md
          - UI: getting-started/samples/ui.md
  - Manual:
      - Core:
          - Core: manual/core/core.md
          - Interop: manual/core/interop.md
          - Math and the world: manual/core/math.md
          - Reflection: manual/core/reflection.md
          - ECS: manual/core/ecs.md
          - Profiling and SIMD: manual/core/profiling.md
      - Native code:
          - Native bindings: manual/native/bindings.md
          - Native libraries: manual/native/native-libraries.md
      - Platform:
          - Platform: manual/platform/platform.md
          - Input actions: manual/platform/input.md
      - Graphics:
          - Graphics: manual/graphics/graphics.md
          - Rendering: manual/graphics/rendering.md
          - Metal: manual/graphics/metal.md
      - Physics:
          - Physics: manual/physics/physics.md
          - Vehicles and hitches: manual/physics/vehicles.md
      - Audio: manual/audio/index.md
      - Network:
          - Network: manual/network/network.md
          - Steam: manual/network/steam.md
      - Scripting:
          - Scripting: manual/scripting/scripting.md
          - Runtime and Luau tests: manual/scripting/runtime.md
      - Content:
          - Content: manual/content/content.md
          - Definitions and schemas: manual/content/defs.md
          - Packages and mods: manual/content/packages.md
          - Packs: manual/content/packs.md
          - Asset import: manual/content/import.md
          - Hot reload: manual/content/hot-reload.md
      - User interface: manual/ui/index.md
      - Tools:
          - Dev tools: manual/tools/devtools.md
          - Editor: manual/tools/editor.md
  - API reference:
      - Overview: api/index.md
      - C#:
          - Overview: api/csharp/index.md
          - Namespaces: api/csharp/namespaces.md
      - Luau:
          - Overview: api/luau/index.md
          - Reference: api/luau/reference.md
          - Enums: api/luau/enums.md
  - Contributing:
      - Contributing: contributing/index.md
      - Help wanted: contributing/help-wanted.md
      - Continuous integration: contributing/continuous-integration.md
      - Writing docs: contributing/writing-docs.md
