name: macOS builds

# Apple silicon and Intel. Each job builds the solution in Release and runs every test project, then publishes the runtime with NativeAOT (./build.sh aot), runs the Luau tests and a fixture game from it,
# and uploads the binaries for whoever has a Mac to try. The hosted runners have a paravirtual GPU that is not Metal 3 (see Docs/manual/graphics/metal.md), so the Metal GPU tests skip unless the probe finds
# one that qualifies: the Metal backend is a help-wanted task (Docs/contributing/help-wanted.md). The Intel job is experimental until the SIGFPE described there is explained: its failure does not fail the run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            lfs: ThirdParty/*/lib/osx-universal/*,ThirdParty/*/lib/osx-arm64/*
            experimental: false
          - os: macos-15-intel
            rid: osx-x64
            lfs: ThirdParty/*/lib/osx-universal/*,ThirdParty/*/lib/osx-x64/*
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      # The native libraries that must load (the tests fail instead of skipping).
      WEFT_REQUIRE_NATIVE: SDL3,flecs,luau,cimgui,vma,meshoptimizer,cgltf,stb_image,audio_decode,openal,weft_net,zstd,freetype,ktx,slang_c,jolt,metal_c
      WEFT_REQUIRE_METAL_COMPILER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lfs: ${{ matrix.lfs }}
      - run: dotnet build Weft.slnx -c Release
      # Whether the runner's (paravirtualized) GPU meets the Metal baseline. If it does the GPU tests and renders must run on it (WEFT_REQUIRE_METAL), else they skip with this reason in the log.
      - name: GPUs (Metal probe)
        run: |
          dotnet run --no-build -c Release --project Source/Weft.Runtime -- --gpu-info | tee gpu-info.txt
          if grep -Eq '^metal: .* ok$' gpu-info.txt; then
            echo "WEFT_REQUIRE_METAL=1" >> "$GITHUB_ENV"
            echo "A Metal GPU that meets the baseline is here: the Metal tests are required."
          else
            echo "No Metal GPU that meets the baseline on this runner: the Metal GPU tests skip."
          fi
      - run: dotnet test --solution Weft.slnx -c Release --no-build
      # The system's crash reports (the faulting thread's frames), when a test program dies: it leaves only an exit code otherwise.
      - name: Crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, json, os
          for path in glob.glob(os.path.expanduser('~/Library/Logs/DiagnosticReports/*.ips')):
              report = json.loads(open(path).read().split('\n', 1)[1])
              images = report['usedImages']
              thread = report['threads'][report['faultingThread']]
              print('==', path, report.get('exception'), thread.get('queue'), thread.get('name'))
              for frame in thread['frames'][:40]:
                  print(hex(frame['imageOffset']), images[frame['imageIndex']].get('name'), frame.get('symbol'), frame.get('symbolLocation'))
          PY
      # Publishes the runtime with NativeAOT and compiles its shaders ahead of time (Shaders/imported), the same command as on a developer's machine.
      - name: NativeAOT publish and shader import
        run: ./build.sh aot
      - name: Luau tests in the NativeAOT runtime
        run: Bin/publish/runtime/Weft.Runtime --luau-test Tests/Luau
      - name: Fixture game
        run: |
          Bin/publish/runtime/Weft.Runtime --game Tests/Fixtures/ShippedGame --user "$RUNNER_TEMP/game-user" --headless --frames 60
          test -s "$RUNNER_TEMP/game-user/ran.txt"
          test -s "$RUNNER_TEMP/game-user/scene.txt"
          test -s "$RUNNER_TEMP/game-user/prefab.txt"
          test -s "$RUNNER_TEMP/game-user/def.txt"
      # Only when the probe found a Metal GPU that meets the baseline: the fixture game rendered on it.
      - name: Rendered on Metal
        if: env.WEFT_REQUIRE_METAL == '1'
        run: |
          Bin/publish/runtime/Weft.Runtime --game Tests/Fixtures/ShippedGame --user "$RUNNER_TEMP/game-user-metal" --headless --size 640x360 --frames 10 --screenshot Bin/game-metal.png
          test -s Bin/game-metal.png
      # The export test (docs: Docs/manual/tools/export.md). The fixture game is exported for this platform, cooked and encrypted, by the published runtime. WEFT_PACK_KEY is a fixed test key that is set on
      # this step only. It is PUBLIC and worthless: it is made up, protects nothing, and an exported game carries its key anyway. Never ship a game with it; a real game's key is a secret of the release process.
      - name: Export the fixture game, cooked and encrypted
        env:
          WEFT_PACK_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        run: Bin/publish/runtime/Weft.Runtime --export Tests/Fixtures/ShippedGame Bin/export --target ${{ matrix.rid }} --cooked
      - name: Exported game, checked
        run: |
          app="Bin/export/Fixture Game.app"
          root="$app/Contents/Resources"
          echo "=== Export folder contents ==="
          find "$app" -type f | sort
          failed=0
          if test -x "$app/Contents/MacOS/FixtureGame"; then
            echo "OK: executable exists and is executable"
          else
            echo "FAILED: executable exists and is executable"
            failed=$((failed + 1))
          fi
          if test -s "$root/data/game.wpak"; then
            echo "OK: pack file exists and is not empty"
          else
            echo "FAILED: pack file exists and is not empty"
            failed=$((failed + 1))
          fi
          pack_magic=$(head -c 4 "$root/data/game.wpak" | od -An -tx1 | tr -d ' \n')
          if test "$pack_magic" != "5750414b"; then
            echo "OK: pack magic bytes are encrypted (not WPAK)"
          else
            echo "FAILED: pack magic bytes are encrypted (not WPAK)"
            echo "First 16 bytes: $(head -c 16 "$root/data/game.wpak" | od -An -tx1 | tr -d ' \n')"
            failed=$((failed + 1))
          fi
          leftover=$(find Bin/export \( -iname '*slang*' -o -name '*.pdb' -o -name '*.dbg' -o -name '*.lib' -o -name '*.exp' -o -name '*.dSYM' -o -name 'steam_appid.txt' \) ! -path '*/Shaders/imported/*')
          if test -z "$leftover"; then
            echo "OK: no leftover files"
          else
            echo "FAILED: no leftover files"
            echo "$leftover"
            failed=$((failed + 1))
          fi
          if git diff --exit-code -- Tests/Fixtures/ShippedGame; then
            echo "OK: no changes to Tests/Fixtures/ShippedGame"
          else
            echo "FAILED: no changes to Tests/Fixtures/ShippedGame"
            git diff --stat Tests/Fixtures/ShippedGame
            failed=$((failed + 1))
          fi
          git_status=$(git status --porcelain Tests/Fixtures)
          if test -z "$git_status"; then
            echo "OK: no untracked files in Tests/Fixtures"
          else
            echo "FAILED: no untracked files in Tests/Fixtures"
            echo "$git_status"
            failed=$((failed + 1))
          fi
          cp "$app/Contents/MacOS/FixtureGame" "$RUNNER_TEMP/FixtureGame-copy"
          # The linker signs an arm64 program ad hoc (the export repairs that signature after it writes the key) and does not sign an x86_64 one: only a signed program has anything to verify.
          if codesign -d "$RUNNER_TEMP/FixtureGame-copy" > /dev/null 2>&1; then
            if codesign --verify --strict --verbose=4 "$RUNNER_TEMP/FixtureGame-copy"; then
              echo "OK: codesign verify"
            else
              echo "FAILED: codesign verify"
              failed=$((failed + 1))
            fi
            if codesign -dvvv "$RUNNER_TEMP/FixtureGame-copy"; then
              echo "OK: codesign dump"
            else
              echo "FAILED: codesign dump"
              failed=$((failed + 1))
            fi
          elif [ "${{ matrix.rid }}" = "osx-arm64" ]; then
            echo "FAILED: an arm64 program must carry a signature"
            failed=$((failed + 1))
          else
            echo "SKIPPED: codesign verify and dump (the ${{ matrix.rid }} program is not signed)"
          fi
          if plutil -lint "$app/Contents/Info.plist"; then
            echo "OK: plist is valid"
          else
            echo "FAILED: plist is valid"
            failed=$((failed + 1))
          fi
          rm -rf "$RUNNER_TEMP/game.iconset"
          if iconutil -c iconset "$app/Contents/Resources/game.icns" -o "$RUNNER_TEMP/game.iconset"; then
            echo "OK: iconutil converted icns"
          else
            echo "FAILED: iconutil converted icns"
            failed=$((failed + 1))
          fi
          if ls "$RUNNER_TEMP/game.iconset" > /dev/null 2>&1; then
            echo "OK: icon set directory has contents"
          else
            echo "FAILED: icon set directory has contents"
            ls "$RUNNER_TEMP/game.iconset" 2>&1 || true
            failed=$((failed + 1))
          fi
          exit $failed
      # The exported game, run headless from another folder, with the key out of the environment (it comes out of the executable) and a player's mod in the user folder. +connect_lobby is what Steam appends to the
      # command line for an invitation: the game ignores it.
      - name: Exported game, run
        run: |
          exe="$PWD/Bin/export/Fixture Game.app/Contents/MacOS/FixtureGame"
          user="$RUNNER_TEMP/exported-user"
          rm -rf "$user"
          mkdir -p "$user/mods"
          cp -r Tests/Fixtures/ShippedGame/dev_mods/patcher "$user/mods/"
          test -z "${WEFT_PACK_KEY-}"
          cd "$RUNNER_TEMP"
          env -u WEFT_PACK_KEY "$exe" --headless --frames 60 --user "$user" +connect_lobby 1
          test -s "$user/ran.txt"
          test -s "$user/scene.txt"
          test -s "$user/prefab.txt"
          test -s "$user/def.txt"
          test -s "$user/document.txt"
          test -s "$user/moddata/patcher/ran.txt"
      - name: Luau definitions
        run: |
          Bin/publish/runtime/Weft.Runtime --luau-defs Bin/defs
          test -s Bin/defs/weft.d.luau
      # What a Mac without CI runs, for the people who test on real hardware.
      - name: Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weft-${{ matrix.rid }}
          path: Bin/publish/runtime
          retention-days: 14
      - name: Screenshots from Metal
        if: env.WEFT_REQUIRE_METAL == '1'
        uses: actions/upload-artifact@v4
        with:
          name: metal-screenshots-${{ matrix.rid }}
          path: Bin/*-metal.png
      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ matrix.rid }}
          path: Bin/export
          retention-days: 14
