name: Bug report
description: Something does not work. Please include a minimal reproduction.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest steps, script or test that shows it. A failing test in `Tests/` is ideal.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, GPU and driver, .NET SDK (`dotnet --version`), the commit, and the output of `Bin/publish/runtime/Apogee.Runtime --gpu-info` for graphics problems.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and validation output
      description: Anything the engine or the Vulkan validation layer printed.
      render: shell
